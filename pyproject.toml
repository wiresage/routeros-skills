# This file only configures the development tools. The repository is not a Python package.
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["htmlmd", "mdx"]
